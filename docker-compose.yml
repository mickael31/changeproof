# ChangeProof AI — docker-compose.yml
# ----------------------------------------

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: changeproof-app
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  db:
    image: pgvector/pgvector:pg16
    container_name: changeproof-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-changeproof}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeproof}
      POSTGRES_DB: ${POSTGRES_DB:-changeproof}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-changeproof} -d ${POSTGRES_DB:-changeproof}"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

volumes:
  pgdata:
    driver: local
